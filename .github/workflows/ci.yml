# Frontend repository root = Next.js app (this folder).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    env:
      # Safe placeholders so `next build` does not depend on local secrets.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CENTRAL_API_URL: http://app.localhost:8000/api
      NEXT_PUBLIC_CENTRAL_DOMAIN: app.localhost
      NEXT_PUBLIC_TENANT_ROOT_DOMAIN: localhost
      NEXT_PUBLIC_CENTRAL_API_PORT: "8000"
      NEXT_PUBLIC_TENANT_API_PORT: "8000"
      NEXT_PUBLIC_REVERB_APP_KEY: local-reverb-key
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: "8080"
      NEXT_PUBLIC_REVERB_SCHEME: http
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        run: npm run build
